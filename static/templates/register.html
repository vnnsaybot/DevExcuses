<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация — DevExcuses</title>
    <link rel="stylesheet" href="/static/styles/main.css">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <a href="/" class="logo">DevExcuses</a>
        </div>
    </header>

    <main class="container">
        <div class="auth-form-container">
            <h2>Создать аккаунт</h2>
            <form action="/register" method="POST">
                <div class="form-group">
                    <label>Имя пользователя (никнейм)</label>
                    <input type="text" name="username" class="form-control" placeholder="@username" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" placeholder="dev@example.com" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn-generate btn-full">Зарегистрироваться</button>
            </form>
            <div class="auth-footer">
                Уже есть аккаунт? <a href="/login">Войти</a>
            </div>
        </div>
    </main>
</body>
</html>
